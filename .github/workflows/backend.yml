name: Backend SQLite and PostgreSQL
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: energytool
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: energytool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U energytool -d energytool_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - if: matrix.database == 'sqlite'
        run: python -m pytest -q
      - if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://energytool:test-only-password@localhost:5432/energytool_test
        run: python -m pytest -q
