name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # asyncio.timeout в ядре требует Python 3.11+, согласованная версия — 3.12.
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project dependencies
        # Отдельное окружение платформы: не смешиваем Pydantic-pin с веб-lock.
        run: python -m pip install -r requirements.txt pytest==8.3.5
      # Проверяем настоящий CSV-адаптер и ZIP ядра; старый baseline заменён Даньком.
      - name: Run unit, integration and CLI acceptance tests
        run: |
          python -m pytest tests/test_solution.py tests/test_acceptance.py tests/core/test_submission.py tests/core/test_engine.py -q
