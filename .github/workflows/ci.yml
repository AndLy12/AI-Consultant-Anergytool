name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      # Скрипт сабмита проверяется отдельно: он не зависит от FastAPI и веб-БД.
      # Полный набор тестов с PostgreSQL запускается в backend.yml на Python 3.12.
      - name: Run unit, integration and CLI acceptance tests
        run: |
          python -m unittest discover -s tests -p 'test_solution.py' -v
          python -m unittest discover -s tests -p 'test_acceptance.py' -v
          python -m unittest discover -s tests -p 'test_http_integration.py' -v
