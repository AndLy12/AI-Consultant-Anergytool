<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energytool — прототип</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><h1>Energytool</h1><p>Прототип консультации. Используйте вымышленные контактные данные.</p>
<p id="status" role="status"></p>
<section id="auth"><h2>Вход или регистрация</h2><form id="auth-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Пароль (от 10 символов)<input id="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required></label><button name="mode" value="login">Войти</button><button name="mode" value="register">Зарегистрироваться</button></form></section>
<section id="workspace" hidden><p id="identity"></p><button id="logout">Выйти</button><button id="new">Новый диалог</button><button id="close">Закрыть чат</button><h2>История диалогов</h2><div id="dialogs"></div><h2>Чат</h2><div id="messages" aria-live="polite"></div><form id="message-form"><label>Сообщение<textarea id="message" maxlength="10000" required></textarea></label><button>Отправить</button></form>
<details><summary>Данные отладки</summary><pre id="debug"></pre></details>
<h2>Карточка заявки</h2><form id="card-form"><label>ФИО<input id="full_name" required maxlength="200"></label><label>Телефон<input id="phone" type="tel" required></label><label>Компания<input id="company" required maxlength="300"></label><label>Резюме<textarea id="summary" required maxlength="10000"></textarea></label><button>Сохранить карточку для проверки</button></form><pre id="card"></pre><label><input type="checkbox" id="consent">Подтверждаю показанные данные и создание заявки</label><button id="confirm" disabled>Подтвердить заявку</button>
<section id="staff" hidden><h2>Проверка обращений</h2><button id="staff-load">Загрузить диалоги и заявки</button><div id="staff-dialogs"></div><pre id="staff-data"></pre></section>
</section></main><script src="/static/app.js"></script></body></html>
