services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_PATH: /app/var/energytool.sqlite3
      CORE_MODE: stub
      COOKIE_SECURE: "false"
    volumes:
      - chat-data:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  chat-data:
